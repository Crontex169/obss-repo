services:
  postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mock_interview
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Hiz siniri sayaclari (REDIS_URL verildiginde). Kalici disk YOK: sayaclar
  # zaten kisa omurludur, yeniden baslatmada sifirlanmasi kabul edilebilir -
  # amac cok-ornekli dagitimda sayaci PAYLASMAK, sonsuza kadar saklamak degil.
  redis:
    image: redis:7-alpine
    container_name: auth-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres-data:
